<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Шашки</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!-- Экран лобби комнаты -->
  <div id="screen-lobby" class="screen">
    <div class="lobby-header">
      <h1 class="game-title">Шашки</h1>
      <div class="room-tag" id="room-tag">#...</div>
    </div>

    <div class="players-list">
      <div class="player-row" id="row-p1">
        <div class="player-marker white"></div>
        <div class="player-details">
          <span class="player-name" id="name-p1">Ты</span>
          <span class="player-color-label">Белые</span>
        </div>
        <div class="player-badges">
          <span class="ready-pill not-ready" id="ready-p1">⏳ Не готов</span>
          <span class="status-pill online" id="status-p1">Подключён</span>
        </div>
      </div>

      <div class="player-row" id="row-p2">
        <div class="player-marker black"></div>
        <div class="player-details">
          <span class="player-name" id="name-p2">Ожидание игрока...</span>
          <span class="player-color-label">Чёрные</span>
        </div>
        <div class="player-badges">
          <span class="ready-pill not-ready" id="ready-p2">⏳ Не готов</span>
          <span class="status-pill offline" id="status-p2">Не в сети</span>
        </div>
      </div>
    </div>

    <div class="action-buttons">
      <button id="btn-ready" class="btn btn-ready">Готов к игре</button>
      <button id="btn-share" class="btn btn-primary">Пригласить друга</button>
      <button id="btn-play-bot" class="btn btn-secondary">Играть с ботом</button>
    </div>
  </div>

  <!-- Оверлей обратного отсчета 3.. 2.. 1.. В бой! -->
  <div id="countdown-overlay" class="countdown-overlay hidden" style="display: none;">
    <div class="countdown-content">
      <div id="countdown-number" class="countdown-number">3</div>
      <div id="countdown-text" class="countdown-text">Приготовьтесь...</div>
    </div>
  </div>
  
  <!-- Экран игры -->
  <div id="screen-game" class="screen hidden">
    <!-- Верхний игрок (соперник) -->
    <div class="game-header">
      <div class="game-player" id="opp-card">
        <div class="player-marker" id="opp-marker"></div>
        <span class="game-player-name" id="opp-name">Соперник</span>
        <span class="game-player-count" id="opp-count">12</span>
        <div class="reaction-bubble" id="opp-reaction"></div>
      </div>
      <div class="timer" id="timer">60</div>
    </div>

    <!-- Доска -->
    <div class="board-wrapper">
      <div id="board"></div>
    </div>

    <!-- Нижний игрок (я) -->
    <div class="game-footer">
      <div class="game-player" id="my-card">
        <div class="player-marker" id="my-marker"></div>
        <span class="game-player-name" id="my-name">Ты</span>
        <span class="game-player-count" id="my-count">12</span>
        <div class="reaction-bubble" id="my-reaction"></div>
      </div>
      <div class="turn-indicator" id="turn-info">Твой ход</div>
    </div>

    <!-- Плавающая панель быстрых реакций/стикеров -->
    <div id="reactions-bar" class="reactions-bar">
      <button class="reaction-btn" data-emoji="🤔" title="Думаю">🤔</button>
      <button class="reaction-btn" data-emoji="👏" title="Аплодисменты">👏</button>
      <button class="reaction-btn" data-emoji="😎" title="Круто">😎</button>
      <button class="reaction-btn" data-emoji="😱" title="Шок">😱</button>
      <button class="reaction-btn" data-emoji="🤝" title="Рукопожатие">🤝</button>
      <button class="reaction-btn" data-emoji="💥" title="Бум">💥</button>
    </div>
  </div>
  
  <!-- Экран окончания игры -->
  <div id="screen-gameover" class="screen hidden">
    <div class="gameover-box">
      <h2 id="result-title">Победа!</h2>
      <p id="result-desc">Игра завершена</p>
      <button id="btn-restart" class="btn btn-primary">В лобби</button>
    </div>
  </div>
  
  <script src="game.js"></script>
</body>
</html>
